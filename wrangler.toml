name = "stock-tracker"
main = "worker-entry.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]
 
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
 
[[d1_databases]]
binding = "DB"
database_name = "stock-tracker-db"
database_id = "8451af7d-ba5b-47b3-915f-8aee5fa82723"
migrations_dir = "migrations"

[[kv_namespaces]]
binding = "STOCK_DATA"
id = "f7845bb8f6c048f0b658ac01797ced0b"
 
[observability]
enabled = true
 
[triggers]
# 免费版每个「账户」只有 5 个 Cron Trigger（实测报错 10072），
# 原来 5 条表达式全被本 Worker 占满，账户下其他 Worker 一个名额都没有。
# 现在只用 2 条，节拍完全不变，由 lib/cron/dispatch.js 按北京时间内部分发：
#   */1  → 队列处理器（每分钟）+ 盘中分时投递（工作日 09:00-15:59 每 5 分钟）
#          + 22:15 全量历史 + 03:00(周二至周六) 只补落后资产
#   */15 → 外部接口健康巡检（单独一趟，避免与队列那趟争抢单次外呼额度）
crons = [
  "*/1 * * * *",
  "*/15 * * * *",
]
 
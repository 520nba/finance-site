name = "stock-tracker"
main = "worker-entry.js"
compatibility_date = "2024-12-30"
compatibility_flags = ["nodejs_compat"]

# 关闭 workers.dev / 预览 URL。
# 原因：本 Worker 已绑定自定义域名 finance.380220.xyz，而 *-<subdomain>.workers.dev
# 是一条**绕过区域设置**的入口（区域上的 TLS/HTTPS/WAF 规则都不适用于 workers.dev 主机名，
# 将来加 Zero Trust Access 也挡不住它）。
# 注意：仅用 API 把 subdomain 设成 disabled 是**不留存**的 —— 下一次 wrangler 部署会按
# 配置把它重新打开，所以必须在这里显式声明。
workers_dev = false
preview_urls = false
 
[assets]
directory = ".open-next/assets"
binding = "ASSETS"
 
[[d1_databases]]
binding = "DB"
database_name = "stock-tracker-db"
database_id = "8451af7d-ba5b-47b3-915f-8aee5fa82723"
migrations_dir = "migrations"

# 原有 [[kv_namespaces]] STOCK_DATA 绑定已移除：
# 实测该命名空间为空、代码里也再无引用（原 lib/storage/kvClient.js 已删除）。
# 注意顺序：必须先部署掉这个绑定，再去控制台/API 删除命名空间，
# 否则「绑定还在、命名空间没了」会让下一次 wrangler 部署直接失败。

[observability]
enabled = true
 
[triggers]
# 免费版每个「账户」只有 5 个 Cron Trigger（实测报错 10072），
# 原来 5 条表达式全被本 Worker 占满，账户下其他 Worker 一个名额都没有。
# 现在只用 2 条，节拍完全不变，由 lib/cron/dispatch.js 按北京时间内部分发：
#   */1  → 队列处理器（每分钟）+ 盘中分时投递（工作日 09:00-15:59 每 5 分钟）
#          + 22:15 全量历史 + 03:00(周二至周六) 只补落后资产
#   */15 → 外部接口健康巡检（单独一趟，避免与队列那趟争抢单次外呼额度）
crons = [
  "*/1 * * * *",
  "*/15 * * * *",
]
 